version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ocr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: OCR
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: ocr-elasticsearch
    restart: unless-stopped

    environment:
      node.name: ocr-elasticsearch
      cluster.name: ocr-cluster
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: ocr-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend

    container_name: ocr-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      elasticsearch:
        condition: service_started

      ollama:
        condition: service_started

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./backend/app/uploads:/app/app/uploads

  frontend:
    build:
      context: ./frontend

    container_name: ocr-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  elasticsearch_data:
  ollama_data: